version 21.2R3-S7.7;
groups {
    re0 {
        system {
            host-name JRT_CO_02-re0;
        }
        interfaces {
            fxp0 {
                unit 0 {
                    family inet {
                        address 10.74.216.149/25 {
                            master-only;
                        }
                    }
                }
            }
        }
    }
    re1 {
        system {
            host-name JRT_CO_02-re1;
        }
        interfaces {
            fxp0 {
                unit 0 {
                    family inet {
                        address 10.74.216.149/25 {
                            master-only;
                        }
                    }
                }
            }
        }
    }
    Exclude_RED_Link {
        protocols {
            mpls {
                label-switched-path <*> {
                    admin-group exclude Red;
                }
            }
        }
    }
    arp-150k {
        interfaces {
            <ae*> {
                unit <*> {
                    family inet {
                        policer {
                            arp police-150k;
                        }
                    }
                }
            }
            <*/*/*> {
                unit <*> {
                    family inet {
                        policer {
                            arp police-150k;
                        }
                    }
                }
            }
        }
    }
    COS_Group_Untrust {
        class-of-service {
            interfaces {
                <*> {
                    scheduler-map QoS-Map;
                    unit * {
                        classifiers {
                            dscp dscp-class;
                            exp exp-class;
                        }
                        rewrite-rules {
                            dscp dscp-rewrite;
                            exp exp-rewrite;
                        }
                    }
                }
            }
        }
    }
}
