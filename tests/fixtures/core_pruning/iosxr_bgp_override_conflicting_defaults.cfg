interface GigabitEthernet0/0/0/0
 ipv4 address 10.0.0.1 255.255.255.252
!
interface Loopback0
 ipv4 address 1.1.1.1 255.255.255.255
!
router bgp 65000
 neighbor-group ONE
  update-source Loopback0
  remote-as 65001
 !
 session-group TWO
  update-source Gi0/0/0/0
  timers 30 90
 !
 neighbor 10.0.0.2
  use neighbor-group ONE
  use session-group TWO
  update-source Loopback0
!
end
