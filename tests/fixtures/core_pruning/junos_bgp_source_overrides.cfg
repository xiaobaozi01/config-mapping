interfaces {
    ge-0/0/0 { unit 0 { family inet { address 10.0.0.1/30; } } }
    ge-0/0/1 { unit 0 { family inet { address 192.0.2.1/24; } } }
    lo0 { unit 0 { family inet { address 1.1.1.1/32; } } }
}
protocols {
    bgp {
        group MIXED-SOURCES {
            local-address 192.0.2.1;
            peer-as 65001;
            export CORE-POLICY;
            allow 192.0.2.0/24;
            neighbor 10.0.0.2 { local-address 1.1.1.1; }
            neighbor 192.0.2.2;
            neighbor 192.0.2.3 { local-address 192.0.2.1; }
        }
        group ALL-LOST {
            local-address 192.0.2.1;
            neighbor 192.0.2.4 { peer-as 65004; }
        }
        group OWN-SOURCES {
            neighbor 10.0.0.3 { local-address 1.1.1.1; peer-as 65003; }
            neighbor 192.0.2.5 { local-address 192.0.2.1; peer-as 65005; }
        }
    }
}
policy-options {
    policy-statement CORE-POLICY { then accept; }
}
