interfaces {
    ge-0/0/0 { unit 0 { family inet { address 192.0.2.1/24; } } }
    ge-0/0/1 { unit 0 { family inet { address 192.0.2.1/24; } } }
    ge-0/0/2 { unit 0 { family inet { address 198.51.100.1/24; } } }
    ge-0/0/3 { unit 0 { family inet { address 198.51.100.1/24; } } }
}
protocols {
    bgp {
        group DEFAULT-KEEP {
            local-address 192.0.2.1;
            neighbor 192.0.2.2 { peer-as 65001; }
        }
        group DEFAULT-LOST {
            local-address 198.51.100.1;
            neighbor 198.51.100.2 { peer-as 65002; }
        }
    }
}
routing-instances {
    CUSTOMER {
        instance-type vrf;
        interface ge-0/0/1.0;
        interface ge-0/0/2.0;
        protocols {
            bgp {
                group VRF-LOST {
                    local-address 192.0.2.1;
                    neighbor 192.0.2.3 { peer-as 65003; }
                }
                group VRF-KEEP {
                    local-address 198.51.100.1;
                    neighbor 198.51.100.3 { peer-as 65004; }
                }
            }
        }
    }
}
