interface GigabitEthernet0/0/0/0.100 l2transport
 encapsulation dot1q 100
!
interface GigabitEthernet0/0/0/0.200 l2transport
 encapsulation dot1q 200
!
interface GigabitEthernet0/0/0/1.100 l2transport
 encapsulation dot1q 100
!
interface GigabitEthernet0/0/0/1.200 l2transport
 encapsulation dot1q 200
!
l2vpn
 pw-class SHARED
  encapsulation mpls
 !
 xconnect group SERVICES
  p2p ACCESS-ONLY
   interface Gi0/0/0/1.100
   neighbor ipv4 192.0.2.10 pw-id 100
    pw-class SHARED
  !
  p2p MIXED
   interface GigabitEthernet0/0/0/0.100
   interface GigabitEthernet0/0/0/1.200
  !
  p2p KEEP
   interface GigabitEthernet0/0/0/0.200
   neighbor ipv4 192.0.2.20 pw-id 200
    pw-class SHARED
  !
  p2p REMOTE-ONLY
   neighbor ipv4 192.0.2.30 pw-id 300
   neighbor ipv4 192.0.2.40 pw-id 400
!
end
