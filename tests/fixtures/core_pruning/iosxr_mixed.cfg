hostname CORE
!
interface GigabitEthernet0/0/0/0
 bundle id 10 mode active
!
interface GigabitEthernet0/0/0/1
 bundle id 10 mode active
!
interface Bundle-Ether10
 ipv4 address 10.0.0.1 255.255.255.252
!
interface Bundle-Ether10.200 l2transport
 encapsulation dot1q 200
 rewrite ingress tag pop 1 symmetric
!
interface GigabitEthernet0/0/0/2.100
 ipv4 address 192.0.2.1 255.255.255.0
 ipv6 address 2001:db8::1/64
!
interface GigabitEthernet0/0/0/2.200 l2transport
 encapsulation dot1q 200
!
interface GigabitEthernet0/0/0/2.201 l2transport
 encapsulation dot1q 201
!
interface GigabitEthernet0/0/0/3
 ipv4 address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet0/0/0/4
 vrf REMOVED
 ipv4 address 1.1.1.1 255.255.255.255
!
interface BVI10
 ipv4 address 198.51.100.1 255.255.255.0
!
interface BVI20
 ipv4 address 203.0.113.1 255.255.255.0
!
interface Loopback0
 ipv4 address 1.1.1.1 255.255.255.255
!
router ospf 1
 area 0
  interface Bundle-Ether10
  !
  interface Gi0/0/0/2.100
   cost 99
!
router static
 address-family ipv4 unicast
  203.0.113.0/24 Gi0/0/0/2.100 192.0.2.2
  198.51.100.0/24 Bundle-Ether10 10.0.0.2
!
router bgp 65000
 neighbor-group ACCESS
  remote-as 65001
  update-source GigabitEthernet0/0/0/2.100
 !
 neighbor-group SAME
  update-source Gi0/0/0/2.100
 !
 session-group SAME
  update-source Loopback0
 !
 session-group ACCESS-SESSION
  update-source Gi0/0/0/2.100
 !
 neighbor-group INHERITED
  use session-group ACCESS-SESSION
 !
 neighbor 192.0.2.2
  use neighbor-group ACCESS
 !
 neighbor 192.0.2.3
  use neighbor-group INHERITED
 !
 neighbor 192.0.2.4
  update-source 192.0.2.1
 !
 neighbor 2001:db8::2
  local-address 2001:db8:0:0:0:0:0:1
 !
 neighbor 10.0.0.4
  use session-group SAME
 !
 neighbor 10.0.0.2
  remote-as 65002
  update-source Loopback0
 !
 neighbor 10.0.0.3
  update-source 1.1.1.1
 !
 vrf REMOVED
  neighbor 10.0.0.5
   update-source 1.1.1.1
!
l2vpn
 bridge group SERVICES
  bridge-domain MIXED
   interface Bundle-Ether10.200
   interface GigabitEthernet0/0/0/2.200
   routed interface BVI10
  !
  bridge-domain ACCESS
   interface GigabitEthernet0/0/0/2.201
   routed interface BVI20
!
vrf SHARED
 address-family ipv4 unicast
  import route-target
   65000:1
!
end
