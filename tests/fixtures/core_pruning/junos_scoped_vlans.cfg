interfaces {
    ge-0/0/0 { unit 100 { vlan-id 100; family bridge; } }
    ge-0/0/1 { unit 100 { vlan-id 100; family bridge; } }
    ge-0/0/2 { unit 0 { family ethernet-switching { vlan { members BLUE; } } } }
    ge-0/0/3 { unit 0 { family ethernet-switching { vlan { members BLUE; } } } }
    irb {
        unit 100 { family inet { address 192.0.2.1/24; } }
        unit 200 { family inet { address 198.51.100.1/24; } }
        unit 300 { family inet { address 203.0.113.1/24; } }
        unit 400 { family inet { address 203.0.114.1/24; } }
    }
}
routing-instances {
    CORE {
        instance-type virtual-switch;
        interface ge-0/0/0.100;
        interface ge-0/0/2.0;
        bridge-domains {
            CORE-BD { vlan-id 100; interface ge-0/0/0.100; routing-interface irb.100; }
        }
        vlans { BLUE { vlan-id 200; l3-interface irb.300; } }
    }
    CUSTOMER {
        instance-type virtual-switch;
        interface ge-0/0/1.100;
        interface ge-0/0/3.0;
        bridge-domains {
            CUSTOMER-BD { vlan-id 100; interface ge-0/0/1.100; routing-interface irb.200; }
        }
        vlans { BLUE { vlan-id 200; l3-interface irb.400; } }
    }
}
