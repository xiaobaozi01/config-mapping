interface GigabitEthernet0/0/0/0
 ipv4 address 10.0.0.1 255.255.255.252
!
interface GigabitEthernet0/0/0/1
 ipv4 address 192.0.2.1 255.255.255.0
 ipv6 address 2001:db8::1/64
!
interface GigabitEthernet0/0/0/2
 vrf BLUE
 ipv4 address 198.51.100.1 255.255.255.0
!
interface Loopback0
 ipv4 address 1.1.1.1 255.255.255.255
!
interface Loopback100
 vrf BLUE
 ipv4 address 192.0.2.1 255.255.255.255
!
interface Loopback200
 vrf RED
 ipv4 address 198.51.100.1 255.255.255.255
!
router bgp 65000
 neighbor-group CORE
  remote-as 65001
  update-source Gi0/0/0/1
 !
 session-group BAD
  timers 15 45
  update-source GigabitEthernet0/0/0/1
 !
 neighbor-group WRAPPER
  use session-group BAD
  remote-as 65002
 !
 neighbor-group OVERRIDE
  use session-group BAD
  update-source Loopback0
  remote-as 65003
 !
 neighbor-group ADDRESS
  local-address 192.0.2.1
  remote-as 65004
 !
 session-group RED-ADDRESS
  local-address 198.51.100.1
  timers 30 90
 !
 session-group IPV6-REMOVED
  local-address 2001:db8:0:0:0:0:0:1
 !
 neighbor 10.0.0.2
  use neighbor-group CORE
  update-source Loopback0
 !
 neighbor 192.0.2.2
  use neighbor-group CORE
 !
 neighbor 10.0.0.3
  use neighbor-group WRAPPER
  update-source lo0
 !
 neighbor 192.0.2.3
  use neighbor-group WRAPPER
 !
 neighbor 10.0.0.4
  use neighbor-group OVERRIDE
 !
 neighbor 192.0.2.4
  use neighbor-group ADDRESS
 !
 neighbor 2001:db8::2
  use session-group IPV6-REMOVED
 !
 vrf BLUE
  neighbor 10.0.0.5
   use neighbor-group ADDRESS
  !
  neighbor 198.51.100.2
   use session-group RED-ADDRESS
 !
 vrf RED
  neighbor 10.0.0.6
   use session-group RED-ADDRESS
!
end
