interfaces {
    ge-0/0/0 { unit 100 { vlan-id 100; family bridge; } }
    ge-0/0/1 { unit 200 { vlan-id 100; family bridge; } }
    irb {
        unit 100 { family inet { address 192.0.2.1/24; } }
        unit 200 { family inet { address 198.51.100.1/24; } }
    }
}
bridge-domains {
    NNI-DOMAIN { vlan-id 100; interface ge-0/0/0.100; routing-interface irb.100; }
    ACCESS-DOMAIN { vlan-id 100; interface ge-0/0/1.200; routing-interface irb.200; }
}
