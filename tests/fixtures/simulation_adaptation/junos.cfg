interfaces {
    ge-0/0/0 {
        disable;
        speed 10g;
        gigether-options {
            no-auto-negotiation;
        }
        unit 0 {
            family inet {
                address 10.0.0.2/30;
            }
        }
    }
    ge-0/0/5 {
        disable;
        speed 10g;
    }
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/0.0 {
                bfd-liveness-detection {
                    minimum-interval 50;
                    minimum-receive-interval 100;
                    multiplier 2;
                }
            }
        }
    }
}
