system { host-name CORE; }
interfaces {
    ge-0/0/10 { gigether-options { 802.3ad ae10; speed 100g; } }
    ge-0/0/11 { gigether-options { 802.3ad ae10; } }
    ae10 {
        aggregated-ether-options { lacp { active; passive; } minimum-links 2; minimum-bandwidth 100g; }
        unit 0 { family inet { address 10.0.0.1/30; } }
        unit 100 { vlan-id 100; family inet { address 10.0.100.1/30; } }
    }
}
protocols { ospf { area 0 { interface ae10.0; interface ae10.100; } } }
