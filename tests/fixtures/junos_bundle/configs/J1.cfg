groups {
    ACCESS-UNI {
        interfaces {
            ge-0/0/3 {
                vlan-tagging;
                unit 100 {
                    vlan-id 100;
                    family inet {
                        address 192.0.2.1/24;
                    }
                }
            }
        }
    }
}
apply-groups ACCESS-UNI;
system {
    host-name J1;
    authentication-order radius;
    radius-server 10.0.0.10 {
        secret OLDSECRET;
    }
    login {
        user old-user {
            class super-user;
        }
    }
}
interfaces {
    ge-0/0/0 {
        gigether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/1 {
        gigether-options {
            802.3ad ae0;
        }
    }
    ae0 {
        unit 0 {
            family inet {
                address 10.0.0.1/30;
            }
        }
    }
    ge-0/0/4 {
        description UNUSED-BARE-PORT;
    }
    lo0 {
        unit 0 {
            family inet {
                address 1.1.1.1/32;
            }
        }
    }
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface ae0.0;
        }
    }
}
