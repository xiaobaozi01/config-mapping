group ACCESS-UNI
 interface GigabitEthernet0/0/0/3
  ipv4 address 192.0.2.2 255.255.255.0
 !
end-group
!
apply-group ACCESS-UNI
!
hostname R2
!
taskgroup OLD-TASKS
 task read bgp
 task write ospf
!
usergroup OLD-USERS
 taskgroup OLD-TASKS
!
username old-user
 secret 5 OLDHASH
 group OLD-USERS
!
tacacs-server host 10.0.0.10 key 7 SECRET
!
line template vty
 password 0 OLDLINE
 login authentication OLD-AUTH
 authorization commands OLD-AUTHZ
 accounting commands OLD-ACCT
 users group OLD-USERS
 exec-timeout 10 0
!
interface GigabitEthernet0/0/0/0
 bundle id 10 mode active
!
interface GigabitEthernet0/0/0/1
 bundle id 10 mode active
!
interface Bundle-Ether10
 ipv4 address 10.0.0.2 255.255.255.252
!
interface Loopback0
 ipv4 address 1.1.1.2 255.255.255.255
!
router ospf 1
 area 0
  interface Bundle-Ether10
!
end
