interfaces {
    ge-0/0/0 { unit 0 { family inet { address 192.0.2.1/24; } } }
    ge-0/0/1 { unit 0 { family inet { address 198.51.100.1/24; } } }
}
system {
    description "document ge-0/0/1.0 but do not interpret";
    /* ge-0/0/1.0 is obsolete */
}
inactive: forwarding-options {
    unknown-feature { source-interface ge-0/0/1.0; }
}
protocols {
    bgp {
        group RETAIN {
            inactive: local-address 198.51.100.1;
            neighbor 10.0.0.1;
        }
    }
}
