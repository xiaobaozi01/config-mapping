system { host-name UNI-TEST; }
interfaces {
    ge-0/0/0 { gigether-options { 802.3ad ae0; } }
    ge-0/0/1 { gigether-options { 802.3ad ae0; } }
    ae0 { unit 0 { family inet { address 10.0.0.1/30; } } }
    ge-0/0/3 {
        description PHYSICAL-UNI;
        mtu 9192;
        speed 10g;
        sonet-options { clocking external; }
        unit 0 { family inet { address 192.0.2.1/24; } }
    }
    ge-0/0/4 {
        unit 100 {
            vlan-id 100;
            family inet {
                address 198.51.100.1/24;
                filter { input KEEP-FILTER; }
            }
        }
    }
    ge-0/0/5 {
        flexible-vlan-tagging;
        unit 200 {
            vlan-tags outer 100 inner 200;
            family inet { address 203.0.113.1/24; }
        }
    }
    ge-0/0/40 { gigether-options { 802.3ad ae20; } }
    ge-0/0/41 { gigether-options { 802.3ad ae20; } }
    ae20 {
        aggregated-ether-options { lacp active; minimum-links 2; }
        unit 0 { family inet { address 172.16.0.1/24; } }
        unit 200 {
            vlan-id 200;
            family inet { address 172.16.1.1/24; }
        }
    }
    ge-0/0/50 {
        unit 300 {
            vlan-id 300;
            family bridge;
        }
    }
    irb { unit 300 { family inet { address 172.20.0.1/24; } } }
}
bridge-domains {
    BD {
        vlan-id 300;
        interface ge-0/0/50.300;
        routing-interface irb.300;
    }
}
routing-instances {
    TENANT-A {
        instance-type vrf;
        interface ge-0/0/3.0;
        route-distinguisher 65000:1;
        vrf-target target:65000:1;
    }
}
protocols { ospf { area 0 { interface ae0.0; } } }
