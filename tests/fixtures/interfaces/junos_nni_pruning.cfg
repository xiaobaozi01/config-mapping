system {
    host-name KEEP-CORE;
}
interfaces {
    ge-0/0/0 {
        gigether-options { 802.3ad ae0; }
    }
    ge-0/0/1 {
        gigether-options { 802.3ad ae0; }
    }
    ae0 {
        unit 100 {
            vlan-id 100;
            family bridge;
        }
    }
    ge-0/0/2 {
        unit 200 {
            family inet { address 192.0.2.1/24; }
        }
    }
    ge-0/0/20 {
        unit 0 {
            family inet { address 192.0.20.1/24; }
        }
    }
    ge-0/0/3 {
        unit 300 {
            family bridge;
        }
    }
    irb {
        unit 100 { family inet { address 198.51.100.1/24; } }
        unit 300 { family inet { address 198.51.103.1/24; } }
    }
    lo0 {
        unit 0 { family inet { address 203.0.113.1/32; } }
    }
    fxp0 {
        unit 0 { family inet { address 10.0.0.1/24; } }
    }
    gr-0/0/0 {
        unit 0 { description VIRTUAL-KEEP; }
    }
    future0 {
        unit 0 { description UNKNOWN-KEEP; }
    }
}
bridge-domains {
    MIXED {
        vlan-id 100;
        interface ae0.100;
        interface ge-0/0/3.300;
        routing-interface irb.100;
    }
    ACCESS-ONLY {
        vlan-id 300;
        interface ge-0/0/3.300;
        routing-interface irb.300;
    }
    SHARED-UNRELATED { vlan-id 999; description KEEP-UNRELATED-DOMAIN; }
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface ae0.100;
            interface ge-0/0/2.200 { passive; }
            interface ge-0/0/20.0;
            interface irb.300;
            interface lo0.0 { passive; }
        }
    }
    bgp {
        group REMOVED-SOURCE {
            local-address 192.0.2.1;
            neighbor 10.10.10.1 { peer-as 64501; }
        }
        group NEIGHBOR-SOURCES {
            neighbor 10.10.10.2 { local-address 198.51.103.1; peer-as 64502; }
            neighbor 10.10.10.3 { local-address 203.0.113.1; peer-as 64503; }
        }
        group SHARED {
            local-address 203.0.113.1;
            neighbor 10.10.10.4 { peer-as 64504; }
        }
    }
}
routing-options {
    static {
        route 10.10.0.0/24 { next-hop ge-0/0/2.200; }
        route 10.11.0.0/24 { qualified-next-hop ge-0/0/2.200 { preference 10; } }
        route 10.12.0.0/24 { next-hop 203.0.113.2; }
        route 10.13.0.0/24 { next-hop ge-0/0/20.0; }
    }
}
routing-instances {
    OLD-VPWS {
        instance-type evpn-vpws;
        protocols { evpn { interface ge-0/0/2.200 { vpws-service-id { local 991; remote 992; } } } }
        interface ge-0/0/2.200;
        route-distinguisher 64500:999;
        vrf-target target:64500:999;
    }
    MIXED-VPWS {
        instance-type evpn-vpws;
        protocols {
            evpn {
                interface ae0.100 { vpws-service-id { local 901; remote 902; } }
                interface ge-0/0/2.200 { vpws-service-id { local 903; remote 904; } }
            }
        }
        interface ae0.100;
        interface ge-0/0/2.200;
    }
    SHARED-VRF {
        instance-type vrf;
        interface ae0.100;
        interface ge-0/0/2.200;
        route-distinguisher 64500:1;
        vrf-target target:64500:1;
        vrf-import SHARED-POLICY;
        routing-options {
            static { route 10.14.0.0/24 { next-hop ge-0/0/2.200; } }
        }
    }
}
policy-options {
    policy-statement SHARED-POLICY {
        term ACCEPT { then accept; }
    }
}
class-of-service {
    interfaces {
        ge-0/0/2 { scheduler-map OLD; }
        ae0 { scheduler-map KEEP; }
    }
}
