interfaces {
    ge-0/0/0 {
        unit 0 { family ethernet-switching { vlan { members BLUE; } } }
    }
    ge-0/0/1 {
        unit 0 { family ethernet-switching { vlan { members RED; } } }
    }
    irb {
        unit 10 { family inet { address 198.51.100.1/24; } }
        unit 20 { family inet { address 198.51.101.1/24; } }
    }
}
vlans {
    BLUE { vlan-id 10; l3-interface irb.10; }
    RED { vlan-id 20; l3-interface irb.20; }
}
