hostname UNI-TEST
!
interface GigabitEthernet0/0/0/0
 bundle id 10 mode active
!
interface GigabitEthernet0/0/0/1
 bundle id 10 mode active
!
interface Bundle-Ether10
 ipv4 address 10.0.0.1 255.255.255.252
!
interface GigabitEthernet0/0/0/3
 description PHYSICAL-UNI
 vrf TENANT-A
 ipv4 address 192.0.2.1 255.255.255.0
 speed 10000
 duplex full
 fec standard
 clock source internal
 pos crc 32
!
interface GigabitEthernet0/0/0/4.100
 encapsulation dot1q 100
 ipv4 address 198.51.100.1 255.255.255.0
 service-policy input KEEP-QOS
!
interface GigabitEthernet0/0/0/5.200
 encapsulation dot1q 100 second-dot1q 200
 ipv4 address 203.0.113.1 255.255.255.0
!
interface GigabitEthernet0/0/0/40
 bundle id 20 mode active
!
interface GigabitEthernet0/0/0/41
 bundle id 20 mode active
!
interface Bundle-Ether20
 bundle minimum-active links 2
 ipv4 address 172.16.0.1 255.255.255.0
!
interface Bundle-Ether20.200
 encapsulation dot1q 200
 ipv4 address 172.16.1.1 255.255.255.0
!
interface GigabitEthernet0/0/0/50.300 l2transport
 encapsulation dot1q 300
 rewrite ingress tag pop 1 symmetric
!
interface BVI900
 vrf TENANT-GATEWAY
 ipv4 address 172.20.0.1 255.255.255.0
!
l2vpn
 bridge group BG
  bridge-domain BD
   interface GigabitEthernet0/0/0/50.300
   routed interface BVI900
!
router ospf 1
 area 0
  interface Bundle-Ether10
  interface GigabitEthernet0/0/0/3
!
custom-service KEEP
 bind-interface GigabitEthernet0/0/0/4.100
!
end
