system {
    host-name JA;
}
interfaces {
    ge-0/0/0 {
        gigether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/1 {
        gigether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/2 {
        gigether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/3 {
        gigether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/4 {
        description UNUSED-BARE-PORT;
    }
    ge-0/0/5 {
        unit 300 {
            vlan-id-list [ 300 301 ];
            input-vlan-map pop;
            output-vlan-map push;
            family bridge {
                interface-mode trunk;
                vlan {
                    members [ 300 301 ];
                }
            }
        }
    }
    irb {
        unit 300 {
            family inet {
                address 198.51.100.1/24;
            }
        }
        unit 400 {
            family inet {
                address 203.0.113.1/24;
            }
        }
    }
    ae0 {
        unit 0 {
            family inet {
                address 10.0.0.1/30;
            }
        }
    }
}
bridge-domains {
    BD300 {
        vlan-id 300;
        interface ge-0/0/5.300;
        routing-interface irb.300;
    }
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface ae0.0;
        }
    }
}
