groups {
    FIRST {
        interfaces {
            <ge-*> {
                mtu 1111;
                unit 0 {
                    family inet {
                        address 10.0.0.1/32;
                    }
                }
            }
        }
    }
    SECOND {
        interfaces {
            <ge-*> {
                mtu 2222;
                unit 0 {
                    family inet {
                        address 10.0.0.2/32;
                    }
                }
            }
        }
    }
    LOCAL {
        interfaces {
            <ge-*> {
                mtu 3333;
            }
        }
    }
}
interfaces {
    ge-0/0/0 {
        apply-groups LOCAL;
    }
    ge-0/0/1 {
        apply-groups-except FIRST;
    }
    ge-0/0/2 {
        mtu 4444;
    }
}
apply-groups [ FIRST SECOND ];
