groups {
    BUSINESS {
        interfaces {
            <ge-*> {
                mtu 9000;
            }
        }
    }
    LOGGING {
        system {
            syslog {
                file messages {
                    any notice;
                    apply-groups MISSING;
                }
            }
        }
    }
}
interfaces {
    ge-0/0/5 {
        unit 0;
    }
}
apply-groups [ BUSINESS LOGGING ];
