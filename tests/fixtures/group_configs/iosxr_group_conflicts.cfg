group OUTER
 interface 'GigabitEthernet.*'
  mtu 9000
  ipv4 address 10.0.0.1 255.255.255.0
  ipv4 access-group GROUP-IN ingress
 !
end-group
!
group INNER
 interface 'GigabitEthernet.*'
  mtu 8000
 !
end-group
!
apply-group OUTER
!
interface GigabitEthernet0/0/0/5
 apply-group INNER
 mtu 1500
 ipv4 address 192.0.2.1 255.255.255.0
 ipv4 access-group EXPLICIT-OUT egress
!
end
