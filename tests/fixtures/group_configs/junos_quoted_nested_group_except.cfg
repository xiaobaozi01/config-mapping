groups {
    "BASE GROUP" {
        interfaces {
            <ge-*> {
                mtu 9000;
            }
        }
    }
    "EDGE GROUP" {
        apply-groups "BASE GROUP";
        interfaces {
            ge-0/0/0 {
                apply-groups-except "BASE GROUP";
            }
        }
    }
}
interfaces {
    ge-0/0/0 {
        unit 0;
    }
}
apply-groups "EDGE GROUP";
