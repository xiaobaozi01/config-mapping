groups {
    EDGE {
        interfaces {
            <ge-*> {
                mtu 9000;
            }
        }
    }
    UNUSED {
        apply-groups-except MISSING-IN-UNUSED;
    }
}
interfaces {
    ge-0/0/0 {
        inactive: apply-groups-except MISSING-INACTIVE;
        unit 0;
    }
}
apply-groups EDGE;
