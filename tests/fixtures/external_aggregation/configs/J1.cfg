system { host-name J1; }
interfaces {
    ge-0/0/10 { gigether-options { 802.3ad ae10; } }
    ge-0/0/11 { gigether-options { 802.3ad ae10; } }
    ge-0/0/12 { gigether-options { 802.3ad ae10; } }
    ge-0/0/13 { gigether-options { 802.3ad ae10; } }
    ae10 {
        aggregated-ether-options { minimum-links 4; }
        unit 0 { family inet { address 10.0.0.1/30; } }
    }
}
protocols { ospf { area 0 { interface ae10.0; } } }
