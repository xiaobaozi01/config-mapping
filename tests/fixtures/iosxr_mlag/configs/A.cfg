hostname A
!
interface GigabitEthernet0/0/0/0
 bundle id 10 mode active
!
interface GigabitEthernet0/0/0/1
 bundle id 10 mode active
!
interface GigabitEthernet0/0/0/2
 bundle id 10 mode active
!
interface GigabitEthernet0/0/0/3
 bundle id 10 mode active
!
interface Bundle-Ether10.100 l2transport
 encapsulation dot1q 100
 rewrite ingress tag pop 1 symmetric
!
interface GigabitEthernet0/0/0/4
 description UNUSED-BARE-PORT
!
interface GigabitEthernet0/0/0/5.200 l2transport
 encapsulation untagged
 rewrite egress tag push dot1q 200 symmetric
 xconnect 192.0.2.20 200 encapsulation mpls
!
interface BVI300
 ipv4 address 198.51.100.1 255.255.255.0
!
interface BVI400
 ipv4 address 203.0.113.1 255.255.255.0
!
l2vpn
 bridge group CORE
  bridge-domain BD100
   interface Bundle-Ether10.100
  !
  bridge-domain BD300
   interface GigabitEthernet0/0/0/5.200
   routed interface BVI300
!
end
