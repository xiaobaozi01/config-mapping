system { host-name A; }
interfaces {
    ge-0/0/0 { ether-options { 802.3ad ae10; } }
    ge-0/0/1 { ether-options { 802.3ad ae10; } }
    ae10 {
        description SKIPPED-BUNDLE;
        unit 0 { family inet { address 192.0.2.1/24; } }
    }
    ge-0/0/7 {
        description ACTIVE-SEVEN;
        unit 0 { family inet { address 10.0.0.1/30; } }
    }
}
