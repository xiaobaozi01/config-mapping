system { host-name A; }
interfaces {
    ge-0/0/0 { gigether-options { 802.3ad ae10; } }
    ge-0/0/1 { gigether-options { 802.3ad ae10; } }
    ae10 {
        flexible-vlan-tagging;
        encapsulation flexible-ethernet-services;
        unit 100 { vlan-id 100; family bridge; }
    }
}
bridge-domains {
    CORE { interface ae10.100; }
}
