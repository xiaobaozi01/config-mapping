interface GigabitEthernet0/0/0/0
 description NNI
 bundle minimum-active links 2
 lacp switchover suppress-flaps 300
 speed 10000
 no negotiation auto
 carrier-delay up 100
 ipv4 address 192.0.2.1 255.255.255.252
 unknown-platform-feature preserve-this
!
interface GigabitEthernet0/0/0/0.100 l2transport
 encapsulation dot1q 100
 rewrite ingress tag pop 1 symmetric
 ethernet dot1q tunneling ethertype 0x9100
!
interface GigabitEthernet0/0/0/1.200
 encapsulation dot1q 200
 ipv4 address 198.51.100.1 255.255.255.0
!
interface GigabitEthernet0/0/0/7
 speed 10000
!
interface BVI300
 ipv4 address 203.0.113.1 255.255.255.0
!
l2vpn
 bridge group TEST
  bridge-domain CUSTOMER
   interface GigabitEthernet0/0/0/0.100
   routed interface BVI300
!
end
