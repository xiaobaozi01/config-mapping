system { host-name A; }
interfaces {
    ge-0/0/0 { gigether-options { 802.3ad ae10; } }
    ge-0/0/1 { gigether-options { 802.3ad ae10; } }
    ae10 { unit 0 { family inet6; } }
}
protocols {
    bgp {
        group CORE {
            local-interface ae10.0;
            neighbor 2001:db8::2 { peer-as 65001; }
        }
    }
}
