services {
    service-set SS-NAT {
        nat-rules R1;
        interface-service {
            service-interface ms-0/0/0;
        }
    }
    nat {
        pool P1 {
            address 203.0.113.0/24;
        }
        rule R1 {
            match-direction input;
            term T1 {
                then {
                    translated {
                        source-pool P1;
                        translation-type {
                            napt-44;
                        }
                    }
                }
            }
        }
    }
}
interfaces {
    ms-0/0/0 {
        unit 0 {
            family inet;
        }
    }
    ge-0/0/0 {
        unit 0 {
            family inet {
                service {
                    input {
                        service-set SS-NAT;
                    }
                    output {
                        service-set SS-NAT;
                    }
                }
                address 10.0.0.1/24;
            }
        }
    }
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/0.0;
        }
    }
}
