router isis 1
 interface GigabitEthernet0/0/0/0
  hello-password hmac-md5 encrypted 0011
  address-family ipv4 unicast
  !
 !
 lsp-password hmac-md5 encrypted 0022
!
router ospf 1
 area 0
  interface GigabitEthernet0/0/0/0
   authentication message-digest
   message-digest-key 1 md5 encrypted 0011
   cost 10
  !
 !
!
flow monitor-map M
 record ipv4
!
sampler-map S
 random 1 out-of 1000
!
interface GigabitEthernet0/0/0/0
 flow ipv4 monitor M sampler S ingress
 monitor-session MS ethernet direction rx-only
 ipv4 address 10.0.0.1 255.255.255.0
!
