system {
    host-name R2;
}
interfaces {
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 192.168.2.1/24;
            }
        }
    }
}
class-of-service {
    interfaces {
        ge-0/0/1 {
            unit 0 {
                scheduler-map SM-UNI;
            }
        }
    }
    scheduler-maps {
        SM-UNI {
            forwarding-class best-effort scheduler BE;
        }
    }
}
protocols {
    lldp {
        interface ge-0/0/1;
    }
    lldp-med {
        interface ge-0/0/1;
    }
    oam {
        ethernet {
            connectivity-fault-management {
                maintenance-domain MD1 {
                    level 5;
                }
            }
        }
    }
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/1.0 {
                bfd-liveness-detection {
                    minimum-interval 300;
                }
            }
        }
    }
}
