!! IOS XR
hostname R1
!
interface Bundle-Ether10
 description NNI-to-R2
 bfd mode ietf
 bfd address-family ipv4 fast-detect
 bfd address-family ipv4 destination 10.0.1.2
 ipv4 address 10.0.1.1 255.255.255.252
 bundle minimum-active links 1
!
interface GigabitEthernet0/0/0/0
 description member-of-BE10
 bundle id 10 mode active
!
interface GigabitEthernet0/0/0/1
 description UNI-to-CE
 lldp
  receive disable
  transmit disable
 !
 cdp
 ethernet cfm
  mep domain MD1 service S1 mep-id 101
 !
 ethernet oam
  link-monitor
   symbol-period window 60000
  !
 !
 service-policy input POLICE-IN
 ipv4 address 192.168.1.1 255.255.255.0
!
ethernet cfm
 domain MD1 level 5
  service S1 down-meps
   continuity-check interval 10s
  !
 !
!
router ospf 1
 area 0
  interface Bundle-Ether10
   bfd fast-detect
  !
  interface GigabitEthernet0/0/0/1
  !
 !
!
end
