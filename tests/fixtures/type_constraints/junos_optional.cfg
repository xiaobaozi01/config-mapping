chassis {
    aggregated-devices {
        ethernet {
            device-count 4;
        }
    }
    fpc 0 {
        sampling-instance SI;
    }
}
protocols {
    isis {
        interface ge-0/0/0.0 {
            level 2 {
                hello-authentication-key "$9$abc";
                hello-authentication-type md5;
                metric 10;
            }
        }
    }
}
forwarding-options {
    sampling {
        instance SI;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                sampling {
                    input;
                }
                address 10.0.0.1/24;
            }
        }
    }
}
