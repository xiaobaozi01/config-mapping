hostname AUTH-XR
!
username old-user
 secret 5 OLDHASH
 group old-group
!
aaa authentication login default group tacacs+ local
!
tacacs-server host 10.0.0.10 key 7 TACACSSECRET
!
radius-server host 10.0.0.20 auth-port 1812 acct-port 1813 key 7 RADIUSSECRET
!
snmp-server community encrypted SNMPSECRET RO
!
ssh server v2
!
ssh client knownhost 192.0.2.10 rsa AAAAOLDKEY
!
telnet vrf default ipv4 server max-servers 5
!
line template vty
 password 0 OLDPASSWORD
 login authentication OLD-AUTH
 exec-timeout 10 0
!
key chain OSPF_KEYS
 key 1
  key-string password 7 OSPFSECRET
 !
!
crypto pki trustpoint PROD-CA
 enrollment url http://ca.example.test
!
hw-module location 0/0/CPU0 reload
!
service cgn NAT1
 service-type nat44
!
flow monitor PROD-FLOW
 exporter PROD-EXPORTER
!
interface Bundle-Ether10
 bundle minimum-active links 2
 bundle minimum-active bandwidth 1000000
 lacp switchover suppress-flaps 300
 ipv4 address 10.0.0.1 255.255.255.252
!
router ospf 1
 authentication message-digest keychain OSPF_KEYS
 area 0
  interface Bundle-Ether10
   authentication message-digest keychain OSPF_KEYS
  !
 !
!
end
