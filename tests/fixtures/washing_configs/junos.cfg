system {
    host-name AUTH-JUNOS;
    authentication-order [ radius tacplus password ];
    radius-server 10.0.0.20 {
        secret RADIUSSECRET;
    }
    radius-options {
        enhanced-accounting;
    }
    tacplus-server 10.0.0.10 {
        secret TACACSSECRET;
    }
    tacplus-options {
        enhanced-accounting;
    }
    accounting {
        destination {
            tacplus;
        }
    }
    login {
        user old-user {
            class super-user;
            authentication {
                encrypted-password OLDHASH;
                ssh-rsa AAAAOLDKEY;
            }
        }
    }
    services {
        ssh {
            authentication-order tacplus;
        }
        telnet;
        netconf {
            ssh;
        }
        ftp;
    }
}
snmp {
    community SNMPSECRET {
        authorization read-only;
    }
}
security {
    ssh-known-hosts {
        host peer.example.test {
            rsa-key AAAAPEERKEY;
        }
    }
    authentication-key-chains {
        key-chain OSPF_KEYS {
            key 1 {
                secret OSPFSECRET;
            }
        }
    }
    pki {
        ca-profile PROD-CA;
    }
    nat {
        source {
            rule-set PROD-NAT;
        }
    }
}
chassis {
    fpc 3 {
        pic 0 {
            pic-mode 100G;
        }
    }
}
services {
    nat {
        pool PROD-POOL;
    }
    service-set PROD-SERVICE {
        nat-rules PROD-NAT;
    }
    flow-monitoring {
        version9 {
            template PROD-FLOW;
        }
    }
}
forwarding-options {
    sampling {
        input {
            rate 1000;
        }
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.0.2/30;
                sampling {
                    input;
                }
            }
        }
    }
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/0.0 {
                authentication {
                    simple-password OSPFSECRET;
                }
            }
        }
    }
}
