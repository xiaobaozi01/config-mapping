system {
    host-name A;
}
interfaces {
    ge-0/0/7 {
        unit 0 {
            family inet {
                address 192.0.2.1/30;
            }
        }
    }
    ge-0/0/8 {
        unit 100 {
            family inet {
                unnumbered-address ge-0/0/7.0;
            }
        }
    }
    demux0 {
        unit 0 {
            demux-options {
                underlying-interface ge-0/0/7;
            }
        }
    }
}
protocols {
    ospf {
        area 0 {
            interface ge-0/0/7.0;
            inactive: interface ge-0/0/8.100;
        }
    }
}
