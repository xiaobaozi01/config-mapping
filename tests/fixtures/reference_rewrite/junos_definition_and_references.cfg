interfaces {
    ge-0/0/1 {
        description TARGET-ONE;
        unit 0 {
            family inet {
                unnumbered-address ge-0/0/0.0;
            }
        }
    }
    ge-0/0/2 {
        description TARGET-TWO;
        unit 0 {
            family inet {
                unnumbered-address ge-0/0/1.0;
            }
        }
    }
    demux0 {
        unit 100 {
            demux-options {
                underlying-interface ge-0/0/0;
            }
            inactive: demux-options {
                underlying-interface ge-0/0/0.0;
            }
        }
    }
    inactive: ge-0/0/0 {
        unit 0 {
            family inet {
                unnumbered-address ge-0/0/1.0;
            }
        }
    }
}
class-of-service {
    interfaces {
        ge-0/0/0 {
            scheduler-map KEEP;
        }
    }
}
protocols {
    ospf {
        area 0 {
            interface ge-0/0/0.0;
            inactive: interface ge-0/0/1.0;
        }
    }
}
# ge-0/0/0.0 is a comment
