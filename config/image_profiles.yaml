profiles:
  cisco_iosxr:
    image: xrv9000
    # 可选：填写实际镜像版本，便于报告和后续版本特定规则匹配。
    version: "7.11.1"
    # 前 n-3 个口供 NNI 分配，最后三个口空置预留；默认八口使用前五口。
    interfaces:
      - GigabitEthernet0/0/0/0
      - GigabitEthernet0/0/0/1
      - GigabitEthernet0/0/0/2
      - GigabitEthernet0/0/0/3
      - GigabitEthernet0/0/0/4
      - GigabitEthernet0/0/0/5
      - GigabitEthernet0/0/0/6
      - GigabitEthernet0/0/0/7
    simulation_adaptation:
      # "off"：不调整模拟参数；compatible：启用目标口并去硬件参数；stable：另放宽激进 BFD。
      # 接口类型兼容与最终校验始终执行，不受此 mode 控制。
      mode: stable
      ensure_data_interfaces_enabled: true
      remove_physical_interface_knobs: true
      bfd_minimum_interval_ms: 300
      bfd_minimum_multiplier: 3
  juniper_junos:
    image: vmx
    version: null
    # 前 n-3 个口供 NNI 分配，最后三个口空置预留；默认八口使用前五口。
    interfaces:
      - ge-0/0/0
      - ge-0/0/1
      - ge-0/0/2
      - ge-0/0/3
      - ge-0/0/4
      - ge-0/0/5
      - ge-0/0/6
      - ge-0/0/7
    simulation_adaptation:
      mode: stable
      ensure_data_interfaces_enabled: true
      remove_physical_interface_knobs: true
      bfd_minimum_interval_ms: 300
      bfd_minimum_multiplier: 3
