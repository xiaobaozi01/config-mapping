rules:
  # 管理面认证（root-authentication、login、tacplus/radius、远程访问服务）的删除与
  # 实验账号写入由内置代码规则 juniper.replace.authentication 原子执行，无需在此配置。

  # vMX 实验固定清理项。以下功能不参与路由协议验证；接口类型在 NNI/UNI
  # 迁移后可能变化，残留在不支持的接口类型上会导致导入报错，因此统一删除。
  - id: remove.protocols.link.discovery
    vendor: juniper_junos
    enable: true
    category: link-discovery
    path:
      - '^protocols$'
    match: '^(?:lldp|lldp-med)$'
    action: delete
    reason: '实验只验证路由协议，删除 LLDP 配置'

  - id: remove.protocols.ethernet.oam
    vendor: juniper_junos
    enable: true
    category: ethernet-oam
    path:
      - '^protocols$'
    match: '^oam$'
    action: delete
    reason: '实验只验证路由协议，删除以太网 CFM/OAM 配置'

  - id: remove.cos.interfaces
    vendor: juniper_junos
    enable: true
    category: interface-qos
    path:
      - '^class-of-service$'
    match: '^interfaces$'
    action: delete
    reason: '实验不验证 QoS，删除 class-of-service 接口挂载'

  # Junos 可选清理项；全部默认启用。
  # 同一 category 的定义与引用规则须同时启用，否则残留引用会指向已删除的对象。
  - id: remove.protocol.auth.definition
    vendor: juniper_junos
    enable: true
    category: protocol-auth-definition
    path:
      - '^security$'
    match: '^authentication-key-chains$'
    action: delete
    reason: '删除生产路由协议认证密钥定义'

  - id: remove.protocol.auth.reference
    vendor: juniper_junos
    enable: true
    category: protocol-auth-reference
    path:
      - '^(?:protocols|routing-instances|logical-systems|interfaces)$'
      - '**'
    match: '^(?:hello-)?authentication(?:-key(?:-chain)?|-algorithm|-type)?\b'
    action: delete
    reason: '删除协议和接口下的生产认证引用'

  - id: remove.security.pki
    vendor: juniper_junos
    enable: true
    category: pki
    path:
      - '^security$'
    match: '^(?:pki|certificates)$'
    action: delete
    reason: '实验环境不使用生产 PKI 配置'

  - id: remove.system.certificates
    vendor: juniper_junos
    enable: true
    category: pki
    path:
      - '^system$'
    match: '^certificates$'
    action: delete
    reason: '实验环境不使用生产证书配置'

  - id: remove.hardware
    vendor: juniper_junos
    enable: true
    category: hardware
    path:
      - '^chassis$'
    match: '^(?:fpc|alarm|fabric)\b'
    action: delete
    reason: '删除目标镜像不适用的物理硬件配置；保留 aggregated-devices 等 ae 口依赖项'

  - id: remove.security.nat
    vendor: juniper_junos
    enable: true
    category: nat
    path:
      - '^security$'
    match: '^nat$'
    action: delete
    reason: '实验环境不使用生产 NAT 配置'

  - id: remove.services.nat
    vendor: juniper_junos
    enable: true
    category: nat
    path:
      - '^services$'
      - '**'
    match: '^(?:nat|nat-rules)\b'
    action: delete
    reason: '实验环境不使用生产 NAT 服务配置'

  - id: remove.flow.monitoring
    vendor: juniper_junos
    enable: true
    category: flow-statistics
    path:
      - '^services$'
      - '**'
    match: '^flow-monitoring$'
    action: delete
    reason: '实验环境不使用生产流量监控配置'

  - id: remove.forwarding.sampling
    vendor: juniper_junos
    enable: true
    category: flow-statistics
    path:
      - '^forwarding-options$'
      - '**'
    match: '^sampling$'
    action: delete
    reason: '实验环境不使用生产转发采样配置'

  - id: remove.chassis.sampling.instance
    vendor: juniper_junos
    enable: true
    category: flow-statistics
    path:
      - '^chassis$'
      - '**'
    match: '^sampling-instance\b'
    action: delete
    reason: '删除引用转发采样实例的 chassis 配置'

  - id: remove.interface.sampling
    vendor: juniper_junos
    enable: true
    category: flow-statistics
    path:
      - '^interfaces$'
      - '**'
    match: '^sampling$'
    action: delete
    reason: '实验环境不使用生产接口采样配置'

  - id: remove.phone.home
    vendor: juniper_junos
    enable: true
    category: phone-home
    path:
      - '^system$'
    match: '^phone-home$'
    action: delete
    reason: '实验环境不使用 phone-home'
