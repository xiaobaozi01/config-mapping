[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gns3-config-adaptor"
version = "0.1.0"
description = "Adapt IOS XR and Junos configurations for GNS3 XRv9000 and vMX images"
requires-python = ">=3.11"
dependencies = [
  "antlr4-python3-runtime==4.13.2",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pyink==26.5.1",
  "pytest>=9,<10",
  "ruff==0.17.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"impl.cisco" = ["antlr/*.g4"]
"impl.juniper" = ["antlr/*.g4"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.pyink]
line-length = 80
target-version = ["py311"]
extend-exclude = "src/impl/(cisco|juniper)/antlr/generated"

[tool.ruff]
line-length = 80
target-version = "py311"
extend-exclude = [
  "src/impl/cisco/antlr/generated",
  "src/impl/juniper/antlr/generated",
]

[tool.ruff.lint]
select = [
  "C901",
  "E4",
  "E7",
  "E9",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "SIM",
  "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/impl/cisco/antlr/parsing.py" = ["N802"]
"src/impl/juniper/antlr/parsing.py" = ["N802"]
"src/impl/cisco/rules/*.py" = ["N802"]
"src/impl/juniper/rules/*.py" = ["N802"]
"tests/**/*.py" = ["B023", "C901", "N802", "RUF059", "SIM117"]
"benchmarks/cleaning_rules.py" = ["B023", "C901"]
